<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snip: URL shortener</title>
<style>
  :root {
    --bg: #f5f7fb; --card: #ffffff; --text: #1b2433; --muted: #5d6b82;
    --line: #dbe2ee; --brand: #2563eb; --brand-dark: #1d4ed8; --ok: #15803d; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1623; --card: #172033; --text: #e8edf6; --muted: #9aa8c0;
      --line: #2a3650; --brand: #4f8bff; --brand-dark: #3b78f0; --ok: #4ade80; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 32px 16px;
  }
  header { text-align: center; margin-bottom: 24px; }
  h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  main { width: 100%; max-width: 640px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  form { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=url] {
    flex: 1 1 260px; padding: 12px 14px; font-size: 1rem; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input[type=url]:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  button {
    padding: 12px 18px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 10px;
    background: var(--brand); color: #fff; cursor: pointer;
  }
  button:hover { background: var(--brand-dark); }
  button:disabled { opacity: 0.6; cursor: wait; }
  button.secondary {
    background: transparent; color: var(--brand); border: 1px solid var(--line);
    padding: 8px 12px; font-size: 0.9rem;
  }
  .error { color: var(--err); margin: 12px 0 0; min-height: 1.2em; }
  #result { display: none; }
  .short { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .short a { font-size: 1.15rem; font-weight: 600; color: var(--brand); word-break: break-all; }
  .qr { display: flex; justify-content: center; }
  .qr img { width: 220px; height: 220px; image-rendering: pixelated; border-radius: 8px; background: #fff; padding: 8px; }
  h2 { margin: 0 0 10px; font-size: 1rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.95rem; word-break: break-all; }
  li:first-child { border-top: 0; }
  li a { color: var(--brand); }
  li span { color: var(--muted); display: block; font-size: 0.85rem; }
  .empty { color: var(--muted); font-size: 0.95rem; }
  .pod { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pod code {
    background: var(--bg); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px;
    font-size: 0.9rem;
  }
  footer { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Snip</h1>
  <p>Paste a long link and get a short one, with a QR code.</p>
</header>
<main>
  <section class="card">
    <form id="form">
      <input id="url" type="url" required placeholder="https://example.com/a/very/long/link" aria-label="Long URL">
      <button id="go" type="submit">Shorten</button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </section>

  <section class="card" id="result" aria-live="polite">
    <div class="short">
      <a id="short" href="#" target="_blank" rel="noopener"></a>
      <button class="secondary" id="copy" type="button">Copy</button>
    </div>
    <div class="qr"><img id="qr" alt="QR code for the short link"></div>
  </section>

  <section class="card">
    <h2>Recent links (this browser)</h2>
    <ul id="recent"></ul>
    <p class="empty" id="empty">No links yet.</p>
  </section>

  <section class="card pod">
    <span>Served by pod: <code id="pod">checking...</code></span>
    <button class="secondary" id="ping" type="button">Check again</button>
  </section>
  <footer>Running on Kubernetes (Amazon EKS). Refresh to see which pod answers.</footer>
</main>

<script>
(function () {
  var form = document.getElementById("form");
  var urlInput = document.getElementById("url");
  var goBtn = document.getElementById("go");
  var errorEl = document.getElementById("error");
  var result = document.getElementById("result");
  var shortEl = document.getElementById("short");
  var qrEl = document.getElementById("qr");
  var copyBtn = document.getElementById("copy");
  var recentEl = document.getElementById("recent");
  var emptyEl = document.getElementById("empty");
  var podEl = document.getElementById("pod");
  var KEY = "snip-recent";

  function loadRecent() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
  }
  function saveRecent(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 5))); } catch (e) {}
  }
  function renderRecent() {
    var list = loadRecent();
    recentEl.innerHTML = "";
    emptyEl.style.display = list.length ? "none" : "block";
    list.forEach(function (item) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = item.short_url; a.textContent = item.short_url; a.target = "_blank"; a.rel = "noopener";
      var s = document.createElement("span");
      s.textContent = item.url;
      li.appendChild(a); li.appendChild(s);
      recentEl.appendChild(li);
    });
  }
  function showPod() {
    podEl.textContent = "checking...";
    fetch("/whoami", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { podEl.textContent = d.pod; })
      .catch(function () { podEl.textContent = "unavailable"; });
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    errorEl.textContent = "";
    goBtn.disabled = true;
    var original = urlInput.value.trim();
    fetch("/shorten", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: original })
    })
      .then(function (r) {
        if (!r.ok) { throw new Error(r.status === 422 ? "That does not look like a valid URL (include https://)." : "Something went wrong. Try again."); }
        return r.json();
      })
      .then(function (d) {
        shortEl.href = d.short_url;
        shortEl.textContent = d.short_url;
        qrEl.src = "/" + d.code + "/qr?size=8&t=" + Date.now();
        result.style.display = "block";
        var list = loadRecent();
        list.unshift({ url: original, short_url: d.short_url });
        saveRecent(list);
        renderRecent();
        showPod();
      })
      .catch(function (e) { errorEl.textContent = e.message; })
      .then(function () { goBtn.disabled = false; });
  });

  copyBtn.addEventListener("click", function () {
    var text = shortEl.textContent;
    function done() { copyBtn.textContent = "Copied"; setTimeout(function () { copyBtn.textContent = "Copy"; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
    }
  });
  document.getElementById("ping").addEventListener("click", showPod);

  renderRecent();
  showPod();
})();
</script>
</body>
</html>
