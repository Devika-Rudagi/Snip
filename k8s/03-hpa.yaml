# Scale-down window shortened to 60 s so the demo shows it within class time
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: snip, namespace: snip}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: snip}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
